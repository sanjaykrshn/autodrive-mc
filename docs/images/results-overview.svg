<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">AutoDrive evaluation results</title>
  <desc id="desc">All three circuits completed one Minecraft lap with zero collisions and 20 out of 20 simulator episodes. Easy averaged 46.2 seconds and 2.23 meters of center deviation; Medium 51.7 seconds and 2.34 meters; Hard 53.0 seconds and 2.11 meters.</desc>
  <rect width="1000" height="330" rx="8" fill="#0d1117"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <g fill="#e6edf3" font-size="16" font-weight="600"><text x="30" y="43">Circuit</text><text x="205" y="43">Minecraft</text><text x="360" y="43">Simulator</text><text x="510" y="43">Mean lap time</text><text x="755" y="43">Mean center deviation</text></g>
    <g fill="#8b949e" font-size="13"><text x="205" y="65">Laps / collisions</text><text x="360" y="65">Episodes completed</text><text x="510" y="65">0–60 seconds</text><text x="755" y="65">0–3 meters</text></g>
    <g stroke="#30363d" stroke-width="1"><path d="M30 84 H970"/><path d="M30 160 H970"/><path d="M30 236 H970"/><path d="M30 312 H970"/></g>
    <g fill="#e6edf3" font-size="18" font-weight="600"><text x="30" y="118">Easy</text><text x="30" y="194">Medium</text><text x="30" y="270">Hard</text></g>
    <g fill="#8b949e" font-size="13"><text x="30" y="140">rookie</text><text x="30" y="216">technical</text><text x="30" y="292">grand_prix</text></g>
    <g fill="#e6edf3" font-size="18"><text x="205" y="125">1 / 0</text><text x="205" y="201">1 / 0</text><text x="205" y="277">1 / 0</text><text x="360" y="125">20 / 20</text><text x="360" y="201">20 / 20</text><text x="360" y="277">20 / 20</text><text x="510" y="117">46.2 s</text><text x="510" y="193">51.7 s</text><text x="510" y="269">53.0 s</text><text x="755" y="117">2.23 m</text><text x="755" y="193">2.34 m</text><text x="755" y="269">2.11 m</text></g>
    <g fill="#21262d"><rect x="510" y="130" width="180" height="6" rx="3"/><rect x="510" y="206" width="180" height="6" rx="3"/><rect x="510" y="282" width="180" height="6" rx="3"/><rect x="755" y="130" width="180" height="6" rx="3"/><rect x="755" y="206" width="180" height="6" rx="3"/><rect x="755" y="282" width="180" height="6" rx="3"/></g>
    <g fill="#8b949e"><rect x="510" y="130" width="138.6" height="6" rx="3"/><rect x="510" y="206" width="155.1" height="6" rx="3"/><rect x="510" y="282" width="159" height="6" rx="3"/><rect x="755" y="130" width="133.8" height="6" rx="3"/><rect x="755" y="206" width="140.4" height="6" rx="3"/><rect x="755" y="282" width="126.6" height="6" rx="3"/></g>
  </g>
</svg>
